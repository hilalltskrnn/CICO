            </div>

            <div id="kart-tipi-container" class="hidden">

                </div>
            </div>

            <div id="hata-mesaji" class="hidden p-4 bg-red-50 border-l-4 border-red-500 text-red-700 font-medium rounded-r-lg"></div>

                        <div class="bg-blue-100 rounded-lg px-3 py-1 text-sm font-bold text-blue-700 border border-blue-200">

                        </div>
                    </div>

                            <p class="text-2xl font-bold text-red-800" id="sonuc-tavan">0.00 TL</p>
                        </div>
                        
                        <div class="bg-yellow-50 rounded-xl p-4 shadow-md transform scale-105 border border-yellow-200 relative z-20">

                            <p class="text-3xl font-extrabold text-yellow-800" id="sonuc-ucret">0.00 TL</p>

                        <div class="bg-green-50 rounded-xl p-4 border border-green-200" id="iade-karti">

                            <p class="text-2xl font-bold text-green-800" id="sonuc-iade">0.00 TL</p>
                        </div>
                    </div>

                        </p>
                    </div>

                </div>
            </div>
        </div>

    const processedData = {}; // hatId -> durak listesi (gomulu veriden doldurulur)

    function hatlariYukle() {
        // hat_kodu'na gore grupla (optgroup icin)
        const gruplar = {};
        HATLAR_DATA.forEach(h => {
            if (!gruplar[h.hat_kodu]) gruplar[h.hat_kodu] = [];
            gruplar[h.hat_kodu].push(h);
        });

        const kodlar = Object.keys(gruplar).sort((a, b) => a.localeCompare(b, 'tr', { numeric: true }));

        kodlar.forEach(kod => {
            const $optgroup = $(`<optgroup label="HAT ${kod}"></optgroup>`);
            gruplar[kod]
                .sort((a, b) => a.yon.localeCompare(b.yon))
                .forEach(h => {
                    const metin = `${h.hat_kodu}${h.yon} - ${h.guzergah_aciklama || ''}`;
                    $optgroup.append(new Option(metin, h.id, false, false));
                });
            $('#hat-secimi').append($optgroup);
        });

        $('#hat-secimi').trigger('change.select2');
    }

    // --- FONKSİYONLAR ---

    function selectCategory(category) {
        selectedCategory = category;
        
        document.querySelectorAll('.kategori-btn').forEach(btn => {
            btn.classList.remove('active', 'bg-blue-600', 'text-white', 'border-blue-600');
            btn.classList.add('text-slate-600', 'border-slate-200');
        });
        
        const buttons = document.querySelectorAll('.kategori-btn');
        buttons.forEach(btn => {
            if(btn.getAttribute('onclick').includes(`'${category}'`)) {
                btn.classList.add('active');
                btn.classList.remove('text-slate-600', 'border-slate-200');
            }
        });

        kartTipiSelect.innerHTML = '<option value="">-- Lütfen Kart Seçiniz --</option>';
        const filteredCards = cardTypes.filter(c => c.category === category);
        
        filteredCards.forEach(card => {
            const option = document.createElement('option');
            option.value = JSON.stringify(card);
            option.textContent = card.name;
            kartTipiSelect.appendChild(option);
        });

        kartTipiContainer.classList.remove('hidden');
        sonucAlani.classList.add('hidden');
    }

    function loadStops(hatId) {
        $('#binis-duragi').empty().append(new Option("-- Biniş Durağı Seçin --", "", true, true));
        $('#inis-duragi').empty().append(new Option("-- İniş Durağı Seçin --", "", true, true));
        $('#binis-duragi').trigger('change.select2');
        $('#inis-duragi').trigger('change.select2');

        const hat = HATLAR_DATA.find(h => String(h.id) === String(hatId));
        const stops = hat ? hat.duraklar : [];
        processedData[hatId] = stops;

        stops.forEach((stop, index) => {
            const displayText = `${index + 1}- ${stop.durak_id ?? ''} ${stop.durak_adi}`;
            const optionBinis = new Option(displayText, index, false, false);
            const optionInis = new Option(displayText, index, false, false);
            $('#binis-duragi').append(optionBinis);
            $('#inis-duragi').append(optionInis);
        });

        $('#binis-duragi').val(null).trigger('change');
        $('#inis-duragi').val(null).trigger('change');

        sonucAlani.classList.add('hidden');
    }

    function ceyregeYuvarla(num) {
        return Math.round(num * 4) / 4;
    }

    function getPrice(km, card) {
        if (km <= 25) return ceyregeYuvarla(card.base);
        return ceyregeYuvarla(card.base + (km - 25) * card.mult);
    }

    function calculatePrice() {
        if (!selectedCategory || kartTipiSelect.value === "") {
            showError("Lütfen bir kart tipi seçiniz.");
            return;
        }

        const bVal = $('#binis-duragi').val();
        const iVal = $('#inis-duragi').val();

        if (!bVal || !iVal) {
            showError("Lütfen biniş ve iniş duraklarını seçiniz.");
            return;
        }

        const bIndex = parseInt(bVal);
        const iIndex = parseInt(iVal);

        if (bIndex > iIndex) {
            showError("İniş durağı, biniş durağından önce olamaz.");
            return;
        }

        hataMesaji.classList.add('hidden');

        const hatId = hatSelect.value;
        const stops = processedData[hatId];
        const card = JSON.parse(kartTipiSelect.value);

        let distance = Math.abs(stops[iIndex].kumulatif_km - stops[bIndex].kumulatif_km);
        const totalLineDistance = stops[stops.length - 1].kumulatif_km;

        // --- 1. İLK ÇEKİM (BLOKE) HESABI --- (hattin tamami uzerinden)
        const maxPrice = getPrice(totalLineDistance, card);

        // --- 2. GERÇEK ÜCRET HESABI --- (kredi karti gibi iadesiz kartlarda tavan ucret alinir)
        let finalPrice = card.noRefund ? maxPrice : getPrice(distance, card);
        if (finalPrice > maxPrice) finalPrice = maxPrice;

        // UI Elementlerini Sıfırla
        bilgiMesaji.classList.add('hidden');
        ucretKartlari.classList.remove('hidden');
        iadeKarti.classList.remove('hidden');
        ucretKartlari.classList.remove('md:grid-cols-2');
        ucretKartlari.classList.add('md:grid-cols-3');

        if (card.category === 'UCRETSIZ') {
            ucretKartlari.classList.add('hidden');
            bilgiMesaji.classList.remove('hidden');
            bilgiMesaji.className = "p-6 rounded-xl border text-center font-medium bg-green-50 text-green-900 border-green-200";
            bilgiMesaji.innerHTML = `
                <p class="text-xl font-extrabold">Bu kart türü ile yolculuğunuz ücretsizdir.</p>
            `;

        } else if (card.noRefund) {
            iadeKarti.classList.add('hidden');
            ucretKartlari.classList.remove('md:grid-cols-3');
            ucretKartlari.classList.add('md:grid-cols-2');

            if (card.name !== 'PERSONEL') {
                bilgiMesaji.classList.remove('hidden');
                bilgiMesaji.className = "mb-6 p-4 rounded-xl border border-red-200 bg-red-50 text-red-700 text-center font-bold";
                bilgiMesaji.innerHTML = "Bu kart tipinde ücret iadesi yoktur.";
            }
        }

        const refund = maxPrice - finalPrice;

        document.getElementById('sonuc-kart-adi').textContent = card.name;
        document.getElementById('sonuc-rota').textContent = hatSelect.options[hatSelect.selectedIndex].text;
        document.getElementById('sonuc-mesafe').textContent = distance.toFixed(2) + " km";

        document.getElementById('sonuc-tavan').textContent = maxPrice.toFixed(2) + " TL";
        document.getElementById('sonuc-ucret').textContent = finalPrice.toFixed(2) + " TL";

        const iadeEl = document.getElementById('sonuc-iade');
        iadeEl.textContent = refund.toFixed(2) + " TL";

        sonucAlani.classList.remove('hidden');
        if (typeof sonucAlani.scrollIntoView === 'function') {
            sonucAlani.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }

    function showError(msg) {
        hataMesaji.textContent = msg;
        hataMesaji.classList.remove('hidden');
        sonucAlani.classList.add('hidden');
    }

    $(document).ready(function() {
        $('#hat-secimi').select2({ placeholder: "-- Güzergah Seçin veya Arayın --", allowClear: true, width: '100%' });
        $('#binis-duragi').select2({ placeholder: "-- Biniş Durağı Seçin --", allowClear: true, width: '100%' });
        $('#inis-duragi').select2({ placeholder: "-- İniş Durağı Seçin --", allowClear: true, width: '100%' });

        $('#hat-secimi').on('change', function() {
             if(this.value) {
                 loadStops(this.value);
             } else {
                 $('#binis-duragi').empty();
                 $('#inis-duragi').empty();
                 sonucAlani.classList.add('hidden');
             }
        });

        $('#hesapla-btn').on('click', calculatePrice);

        hatlariYukle();
    });

</script>
</body>
</html>
